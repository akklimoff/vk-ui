services:
  web:
    build: .
    env_file: .env
    restart: unless-stopped
    init: true
  caddy:
    image: caddy:2
    environment:
      WEB_DOMAIN: ${WEB_DOMAIN:?WEB_DOMAIN — адрес панели для Caddy}
    ports:
      - "8080:8080"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    restart: unless-stopped
    depends_on:
      - web

volumes:
  caddy_data:
