{% extends "base.html" %}{% block body %}
{% if peers|length > 1 %}<div class="chips" role="navigation" aria-label="Чаты">
  <a class="chip" href="/journal" {% if not peer %}aria-current="page"{% endif %}>Все</a>
  {% for p in peers %}<a class="chip" href="/journal?peer={{ p }}" {% if p == peer %}aria-current="page"{% endif %}>{{ p|peer_label }}</a>{% endfor %}
</div>{% endif %}
{% include "partials/journal_poll.html" %}
<p id="feed-empty" class="muted" {% if entries %}hidden{% endif %}>Просьб ещё не было.</p>
<div id="feed">{% set embedded = true %}{% include "partials/journal.html" %}</div>
{% endblock %}
