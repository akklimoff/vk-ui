{% extends "base.html" %}{% block body %}
<article>
  <form method="get" class="row">
    <span>Персона: <b>{{ v.persona_name }}</b></span>
    <label style="flex:1 1 14rem">Собеседник (личка)
      <select name="user" hx-get="/prompts" hx-target="#layers" hx-swap="outerHTML" hx-push-url="true">
        <option value="">— беседа —</option>
        {% for k in user_keys %}<option value="{{ k }}" {{ 'selected' if k == v.user_key }}>{{ k }}</option>{% endfor %}
      </select></label>
    <noscript><button>Показать</button></noscript>
  </form>
</article>
{% include "partials/prompts.html" %}
{% endblock %}
