{% extends "base.html" %}{% block body %}
<form method="post" action="/sandbox" hx-post="/sandbox" hx-target="#sandbox-result" hx-swap="outerHTML show:top" hx-disabled-elt="find button">
  <article>
    <p class="muted">Пробный прогон: агент получает просьбу и работает как настоящий, но в VK ничего не пишет, ответ не отправляет и записи в журнале не оставляет. Читает из VK по-настоящему.</p>
    <label>Просьба <small>как её написали бы в обращении к агенту</small>
      <textarea name="text" x-data="autogrow" @input="grow()" required>{{ form.text }}</textarea></label>
    <div class="grid">
      <label>Где просят
        <select name="peer">
          <option value="saved">«Избранное»</option>
          {% for p in peers %}<option value="{{ p }}" {{ 'selected' if form.peer == p|string }}>{{ p|peer_label }}</option>{% endfor %}
        </select></label>
      <label>Кто просит <small>в «Избранном» — всегда владелец; в беседе права у обоих одинаковы, «да» спрашивается только в «Избранном»</small>
        <select name="role">
          <option value="owner">владелец</option>
          <option value="trusted" {{ 'selected' if form.role == 'trusted' }}>доверенный человек</option>
        </select></label>
    </div>
    <div class="grid">
      <label>Персона
        <select name="persona">
          <option value="">по умолчанию</option>
          {% for p in personas %}<option value="{{ p.slug }}" {{ 'selected' if p.slug == active }}>{{ p.name }}</option>{% endfor %}
        </select></label>
      <label>Температура
        <input name="temperature" type="text" inputmode="decimal" value="{{ form.temperature if form.temperature is defined else temperature }}"></label>
    </div>
    <label>Модель
      <select name="model">
        <option value="" {{ 'selected' if not active_model }}>по умолчанию из .env ({{ default_model }})</option>
        {% for group, models in model_groups %}<optgroup label="{{ group }}">
          {% for m in models %}<option value="{{ m.id }}" {{ 'selected' if m.id == active_model }}>{{ m.label }}</option>{% endfor %}
        </optgroup>{% endfor %}
      </select></label>
    <footer class="sticky-actions"><button>Попробовать — ничего не отправится</button></footer>
  </article>
</form>
{% include "partials/sandbox.html" %}
{% endblock %}
