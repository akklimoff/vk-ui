{% extends "base.html" %}{% block body %}
<form method="post" action="/sandbox" hx-post="/sandbox" hx-target="#sandbox-result" hx-swap="outerHTML show:top" hx-disabled-elt="find button">
  <article>
    <div class="grid">
      <label>Персона <select name="persona">
        <option value="">по умолчанию</option>
        {% for p in personas %}<option value="{{ p.slug }}" {{ 'selected' if p.slug == active }}>{{ p.name }}</option>{% endfor %}
      </select></label>
      <label>Температура <input name="temperature" type="text" inputmode="decimal" value="{{ form.temperature if form else '0.8' }}"></label>
      <label>Кто спрашивает <input name="asker" value="{{ form.asker if form else 'Собеседник' }}"></label>
    </div>
    <div class="grid">
      <label>peer_id из VK <small>пусто — берём диалог из поля ниже</small>
        <input name="peer_id" type="text" inputmode="numeric" value="{{ form.peer_id if form else '' }}"></label>
      <label>Последних сообщений <input name="count" type="text" inputmode="numeric" value="{{ form.count if form else '40' }}"></label>
    </div>
    <label>Диалог <small>строки «Имя: текст», свои реплики — «Ты: …»</small>
      <textarea name="conversation" class="mono" x-data="autogrow" @input="grow()">{{ form.conversation if form else '' }}</textarea></label>
    <footer class="sticky-actions"><button>Ответить (без отправки)</button></footer>
  </article>
</form>
{% include "partials/sandbox.html" %}
{% endblock %}
