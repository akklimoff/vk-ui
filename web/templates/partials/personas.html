<div id="personas">
{% for p in personas %}<article>
  <header class="row">
    <b>{{ p.name }}</b> <span class="muted">{{ p.slug }}</span>
    {% if p.slug == active %}<span class="badge ok">активна</span>{% endif %}
  </header>
  <p class="muted">{{ p.prompt[:200] }}{% if p.prompt|length > 200 %}…{% endif %}</p>
  <footer class="row">
    {% if p.slug != active %}<form method="post" action="/personas/{{ p.slug }}/activate"
          hx-post="/personas/{{ p.slug }}/activate" hx-target="#personas" hx-swap="outerHTML">
      <button>Активировать</button></form>{% endif %}
    <a href="/personas/{{ p.slug }}/edit" role="button" class="outline secondary">Редактировать</a>
  </footer>
</article>{% else %}<p class="muted">Персон нет — агент использует PERSONA_PROMPT из окружения.</p>{% endfor %}
</div>
