<form id="settings-form" method="post" action="/settings" hx-post="/settings" hx-target="#settings-form" hx-swap="outerHTML">
  <article>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <label>Модель <small>меняется на лету, перезапуск не нужен</small>
      <select name="active_model">
        <option value="" {{ 'selected' if not form.active_model }}>по умолчанию из .env ({{ default_model }})</option>
        {% for group, models in model_groups %}<optgroup label="{{ group }}">
          {% for m in models %}<option value="{{ m.id }}" {{ 'selected' if m.id == form.active_model }}>{{ m.label }}</option>{% endfor %}
        </optgroup>{% endfor %}
      </select></label>
    <div class="grid">
      <label>Температура <small>0 — предсказуемо, 1 — креативно; Claude 5 её не принимает</small>
        <input name="temperature" value="{{ form.temperature }}" type="text" inputmode="decimal" required></label>
      <label>Сообщений контекста
        <input name="context_messages" value="{{ form.context_messages }}" type="text" inputmode="numeric" required></label>
    </div>
    <div class="grid">
      <label>Задержка ответа от, с
        <input name="reply_delay_min" value="{{ form.reply_delay_min }}" type="text" inputmode="decimal" required></label>
      <label>Задержка ответа до, с
        <input name="reply_delay_max" value="{{ form.reply_delay_max }}" type="text" inputmode="decimal" required></label>
    </div>
    <label>Пауза перед ответом в личке, с <small>0 — отвечать сразу, иначе ждём тишины и отвечаем одним сообщением</small>
      <input name="dm_debounce_seconds" value="{{ form.dm_debounce_seconds }}" type="text" inputmode="decimal" required></label>
    <label>Чаты на паузе <small>peer_id через запятую</small>
      <input name="paused_peers" value="{{ form.paused_peers }}" type="text" inputmode="numeric"></label>
    <p class="muted">Лимиты частоты ответов задаются в .env и требуют перезапуска.</p>
    <footer class="sticky-actions"><button>Сохранить</button></footer>
  </article>
</form>
